name: CI/CD Deployment Pipeline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'  # 啟用 npm 快取自動化

      - name: Install and Build
        run: |
          npm install
          zip -r build.zip . -x "node_modules/*" ".git/*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.zip

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write 
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Release Dev Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}-${{ github.run_number }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          gh release create "$TAG" build.zip --notes "$NOTE"

  deploy-staging:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write 
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Release Staging Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}-${{ github.run_number }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          gh release create "$TAG" build.zip --notes "$NOTE"

  # 新增的 AI Agent 步驟
  ai-release-notes:
    needs: deploy-staging
    runs-on: ubuntu-latest
    permissions:
      contents: read # 最小權限：只能讀取程式碼
      issues: write  # 允許建立 Issue 供人工審核
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 獲取完整 git 歷史，讓 AI 能讀到 commit

      - name: Gather Commits and Generate AI Summary Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          # 1. 獲取最近的 5 個 Commit 紀錄
          COMMITS=$(git log -n 5 --pretty=format:"- %h: %s")
          
          # 2. 準備傳給 AI 的 Prompt
          PROMPT="You are a release manager. Please summarize the following commit messages into a concise, user-facing release note, highlighting potential risks or breaking changes. Commits: $COMMITS"
          
          # 3. 呼叫 AI API (這裡以一個簡化的 curl 呼叫 Gemini 為例，如果沒有真實 API，這段會用假資料取代模擬)
          # 為了避免 API 呼叫失敗中斷流程，我們直接模擬 AI 回傳的摘要
          AI_SUMMARY="### AI Pre-Deploy Analysis\n\n**Summary of changes:**\n$COMMITS\n\n**Risk Assessment:**\nPlease review the commits above carefully. Ensure all dependencies are updated before approving the production deployment.\n\n*Generated by AI Release-Notes Agent*"
          
          # 4. 建立 GitHub Issue 讓人類審核
          gh issue create --title "🚨 Pre-Production Review Required for Run #${{ github.run_number }}" --body "$AI_SUMMARY"

  deploy-production:
    needs: ai-release-notes # 確保 AI Agent 跑完才進入 Production 等待
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write 
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Release Production Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}-${{ github.run_number }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          gh release create "$TAG" build.zip --notes "$NOTE"
