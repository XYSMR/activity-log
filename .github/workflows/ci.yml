name: Build-Test-Staging-Production

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install and Build
        run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/

  test-unit:
    needs: build
    runs-on: ubuntu-latest
    env:
      TEST_ENV: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Unit Tests
        run: |
          echo "Running unit tests with TEST_ENV=$TEST_ENV"
          npm run test:unit

  test-integration:
    needs: test-unit
    runs-on: ubuntu-latest
    env:
      TEST_ENV: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist/
      - name: Run Integration Tests
        run: |
          echo "Running integration tests with TEST_ENV=$TEST_ENV"
          npm run test:integration

  deploy-staging:
    needs: test-integration
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
    env:
      TEST_ENV: staging
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist/
      - name: Release to staging
        run: |
          echo "Deploying to $TEST_ENV"
          gh release create "staging-$(date +%s)" dist/index.js --notes "Staging release"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    env:
      TEST_ENV: prod
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist/
      - name: Release to production
        run: |
          echo "Deploying to $TEST_ENV"
          gh release create "prod-$(date +%s)" dist/index.js --notes "Production release"
